name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Type-aware ESLint over the whole monorepo needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Render tests run real WebGL in Playwright's headless Chromium on SwiftShader (no GPU needed).
      - name: Install Playwright Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: pnpm --filter @reelforge/engine exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @reelforge/engine exec playwright install --only-shell chromium

      - name: Render tests (SwiftShader goldens)
        run: pnpm test:render

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-${{ matrix.os }}
          path: packages/engine/out/golden-diff/
          if-no-files-found: ignore
