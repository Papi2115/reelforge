<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReelForge world - detective-board 2a "Wall in a dark room" - D. B. Cooper (1971)</title>
<link rel="stylesheet" href="showcase.css">
</head>
<body>
<main>
  <header>
    <h1>detective-board 2a <b>/</b> wall in a dark room <b>/</b> D. B. Cooper, 1971</h1>
    <span class="sub">640x360, 30 fps, 24 colours, one wall, one camera, t-pure</span>
  </header>
  <canvas id="view" width="640" height="360"></canvas>
  <div class="caption" id="caption"></div>
  <div class="bar" id="shots"></div>
  <div class="bar">
    <button id="playAll" title="A">Play all</button>
    <button id="playShot">Play shot</button>
    <label><input id="loop" type="checkbox" checked> loop shot</label>
    <button id="pause" title="Space">Pause</button>
    <div class="scrubwrap"><div id="marks"></div><input id="scrub" type="range" min="0" max="1919" step="1" value="0"></div>
    <span class="time" id="time">0.00 s</span>
  </div>
  <div class="bar">
    <label><input id="cap" type="checkbox" checked> dev caption (narration)</label>
    <span class="keys">keys: 1-8 shot, A play all, space pause, left/right frame step. URL: ?shot=3&amp;t=1.5&amp;paused=1</span>
  </div>
  <div class="note" id="note"></div>
</main>
<script src="core.js"></script>
<script src="fonts.js"></script>
<script src="paper.js"></script>
<script src="art.js"></script>
<script src="room.js"></script>
<script src="world.js"></script>
<script src="desk.js"></script>
<script src="camera.js"></script>
<script src="scene.js"></script>
<script src="light.js"></script>
<script src="render.js"></script>
<script src="player.js"></script>
</body>
</html>
