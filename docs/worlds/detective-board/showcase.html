<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReelForge world - detective-board - The 1911 theft of the Mona Lisa</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0a0f; color: #c9c1ae; font: 13px/1.45 Consolas, 'Cascadia Mono', monospace; }
  main { display: flex; flex-direction: column; align-items: center; padding: 18px 12px 28px; gap: 12px; }
  header { width: min(100%, 1280px); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { font-size: 14px; font-weight: normal; margin: 0; color: #e6d9ba; letter-spacing: 0.04em; }
  h1 b { color: #d8281c; font-weight: normal; }
  .sub { color: #6f6a5e; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 1px #24212d; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { background: #1c1a26; color: #c9c1ae; border: 1px solid #393543; font: inherit; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed='true'] { background: #d8281c; border-color: #d8281c; color: #f8f2de; }
  button:focus-visible, input:focus-visible { outline: 1px solid #dca462; outline-offset: 1px; }
  input[type='range'] { width: min(60vw, 560px); accent-color: #d8281c; }
  .time { min-width: 92px; text-align: right; color: #8a8576; }
  .caption { min-height: 2.9em; max-width: 1000px; text-align: center; color: #e6d9ba; font-size: 15px; }
  .caption[hidden] { display: block; visibility: hidden; }
  .note { color: #8a8576; max-width: 1000px; text-align: center; }
  .note b { color: #dca462; font-weight: normal; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <h1>detective-board <b>/</b> The 1911 theft of the Mona Lisa</h1>
    <span class="sub">640x360 internal, 30 fps, 16 colours, t-pure</span>
  </header>
  <canvas id="view" width="640" height="360"></canvas>
  <div class="caption" id="caption"></div>
  <div class="bar" id="shots"></div>
  <div class="bar">
    <button id="play" title="Space">Pause</button>
    <input id="scrub" type="range" min="0" max="7" step="0.0333333" value="0">
    <span class="time" id="time">0.00 s</span>
    <label><input id="cap" type="checkbox" checked> show dev caption</label>
  </div>
  <div class="note" id="note"></div>
</main>
<script src="gfx.js"></script>
<script src="fonts.js"></script>
<script src="art.js"></script>
<script src="shots.js"></script>
<script src="props.js"></script>
<script src="shots-late.js"></script>
<script src="player.js"></script>
</body>
</html>
