<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReelForge world showcase - sketchbook v2 - why we have February 29</title>
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body>
    <main>
      <h1>REELFORGE WORLD &middot; <b>SKETCHBOOK v2</b> &middot; why we have February 29 (the calendar bug)</h1>
      <canvas id="frame" width="960" height="540"></canvas>
      <div id="caption"></div>
      <div class="bar" id="shots"></div>
      <div class="bar">
        <button id="all" title="A">play all</button>
        <button id="one">play shot</button>
        <button id="play">pause</button>
        <label><input id="loop" type="checkbox" /> loop</label>
        <label><input id="showCaption" type="checkbox" checked /> dev caption</label>
      </div>
      <div class="bar scrubwrap">
        <div class="scrub"><input id="scrub" type="range" min="0" max="90" step="0.0333333" value="0" /><div id="marks"></div></div>
        <span id="time">0.00 s</span>
      </div>
      <div id="note"></div>
      <div id="keys">keys: 1-9, 0 (=10) play shot &middot; A play all &middot; space play/pause &middot; &larr;/&rarr; one frame &middot; URL ?shot=3&amp;t=2.5&amp;paused=1</div>
    </main>
    <script src="js/core.js"></script>
    <script src="js/font.js"></script>
    <script src="js/ink.js"></script>
    <script src="js/paper.js"></script>
    <script src="js/figures.js"></script>
    <script src="js/doodles.js"></script>
    <script src="js/shots-a.js"></script>
    <script src="js/shots-b.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/popup-kit.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/accordion-strip.js"></script>
    <script src="js/accordion.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
