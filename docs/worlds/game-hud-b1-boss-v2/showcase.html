<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReelForge world showcase · game-hud B1 v2 · Boss-fight montage, 10 shots (1983 crash)</title>
<link rel="stylesheet" href="showcase.css">
</head>
<body>
<div id="wrap">
  <header>
    <span class="world">game-hud · B1 v2 “Boss-fight montage”</span>
    <span class="topic">The 1983 crash and the E.T. cartridges · 10 shots · 640×360 · 30 fps · 23 inks</span>
  </header>
  <canvas id="frame" width="640" height="360"></canvas>
  <div id="caption" class="caption">&nbsp;</div>
  <div class="timeline">
    <div id="markers"></div>
    <input id="scrub" type="range" min="0" max="1" step="1" value="0">
  </div>
  <div class="row">
    <button id="playall" class="primary">▶ Play all (A)</button>
    <button id="playshot">Play shot</button>
    <button id="playpause">pause (space)</button>
    <label><input id="loop" type="checkbox"> loop shot (L)</label>
    <span id="mode"></span>
  </div>
  <div id="shots" class="row shots"></div>
  <div id="time" class="time"></div>
  <p class="help">keys: 1–9, 0 (= shot 10) play shot · A play all · space play/pause · ←/→ frame step · L loop · URL: ?shot=3&amp;t=2.5&amp;paused=1 (t is shot-local; without shot it is film time)</p>
</div>
<script src="js/core.js"></script>
<script src="js/fonts.js"></script>
<script src="js/film.js"></script>
<script src="js/tv.js"></script>
<script src="js/hud.js"></script>
<script src="js/room.js"></script>
<script src="js/trans.js"></script>
<script src="js/shots-a.js"></script>
<script src="js/shots-b.js"></script>
<script src="js/shots-hs.js"></script>
<script src="js/shots-manual.js"></script>
<script src="js/player.js"></script>
</body>
</html>
