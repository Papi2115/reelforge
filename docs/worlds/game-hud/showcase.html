<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReelForge world: game-hud (Y2K)</title>
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body>
    <header>
      <h1>game-hud <span>the film as a video-game level</span></h1>
      <p class="subject">Subject: Y2K, the bug that almost broke the world &middot; 640&times;360 &middot; 30 fps &middot; 16 colours</p>
    </header>
    <main>
      <div class="stage"><canvas id="screen" width="640" height="360"></canvas></div>
      <p id="caption" class="caption"></p>
      <div class="controls">
        <div class="shots">
          <button data-shot="0">1 Hook</button>
          <button data-shot="1">2 A-roll</button>
          <button data-shot="2">3 B-roll</button>
          <button data-shot="3">4 C-roll</button>
          <button data-shot="4">5 Payoff</button>
        </div>
        <button id="play">Pause (space)</button>
        <input id="scrub" type="range" min="0" max="7" step="0.0333333" value="0" />
        <span id="time" class="time"></span>
        <label><input id="show-caption" type="checkbox" checked /> show dev caption</label>
      </div>
      <p class="note-label">Art note</p>
      <p id="note" class="note"></p>
      <p class="hint">Keys: 1&ndash;5 shots &middot; space play/pause &middot; &larr; &rarr; step one frame</p>
    </main>
    <script src="showcase.js"></script>
  </body>
</html>
