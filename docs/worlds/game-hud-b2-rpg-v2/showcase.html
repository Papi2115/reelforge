<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReelForge world showcase - game-hud B2 v2 First-person RPG - the 1983 crash and the E.T. cartridges</title>
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body>
    <main>
      <h1>REELFORGE WORLD &middot; <b>GAME-HUD B2 v2 &middot; FIRST-PERSON RPG</b> &middot; 1983: the crash and the E.T. cartridges</h1>
      <canvas id="frame" width="640" height="360"></canvas>
      <div id="caption"></div>
      <div class="bar" id="shots"></div>
      <div class="bar">
        <button id="all" title="A">play all</button>
        <button id="one">play shot</button>
        <button id="play">pause</button>
        <label><input id="loop" type="checkbox" /> loop</label>
        <label><input id="showCaption" type="checkbox" checked /> dev caption</label>
      </div>
      <div class="bar scrubwrap">
        <div class="scrub"><input id="scrub" type="range" min="0" max="82" step="0.0333333" value="0" /><div id="marks"></div></div>
        <span id="time">0.00 s</span>
      </div>
      <div id="note"></div>
      <div id="keys">keys: 1-9, 0 play shot (0 = 10) &middot; A play all &middot; space play/pause &middot; &larr;/&rarr; one frame &middot; URL ?shot=4&amp;t=2.5&amp;paused=1 (local) or ?t=30&amp;paused=1 (global)</div>
    </main>
    <script src="js/core.js"></script>
    <script src="js/font.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/world.js"></script>
    <script src="js/path.js"></script>
    <script src="js/raycast.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/film.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/overlays.js"></script>
    <script src="js/automap-data.js"></script>
    <script src="js/automap.js"></script>
    <script src="js/intermission-art.js"></script>
    <script src="js/intermission.js"></script>
    <script src="js/render.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
