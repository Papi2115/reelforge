<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>c-plus engine - demo cut</title>
    <style>
      body { margin: 0; background: #16130f; color: #cfc5a8; font: 14px/1.4 Georgia, serif; }
      main { display: flex; flex-direction: column; align-items: center; padding: 10px 16px; gap: 8px; }
      h1 { font-size: 15px; font-weight: normal; margin: 0; }
      canvas { display: block; background: #000; box-shadow: 0 0 0 1px #3a332a; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
      button { background: #2b251e; color: #cfc5a8; border: 1px solid #4a4034; padding: 4px 10px; font: inherit; cursor: pointer; }
      button.on { background: #5b3a22; border-color: #c9a24a; }
      #scrub { width: min(70vw, 900px); }
      #note { font-size: 12px; color: #a99f86; text-align: center; max-width: 1100px; }
    </style>
  </head>
  <body>
    <main>
      <h1>c-plus engine &middot; demo cut (solved handshake, face contact, palm on a counter) &middot; <a href="test.html" style="color:#c9a24a">turnarounds + validators</a></h1>
      <canvas id="frame" width="1920" height="1080"></canvas>
      <div class="bar" id="shots"></div>
      <div class="bar">
        <button id="play">pause</button>
        <input id="scrub" type="range" min="0" max="13" step="0.0416667" value="0" />
        <span id="time">0.00 s</span>
        <label><input id="loop" type="checkbox" /> loop</label>
        <label><input id="captions" type="checkbox" checked /> narration</label>
      </div>
      <div id="note"></div>
    </main>
    <script src="js/core.js"></script>
    <script src="js/brushes.js"></script>
    <script src="js/light.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/rig.js"></script>
    <script src="js/limbs.js"></script>
    <script src="js/poses.js"></script>
    <script src="js/acting.js"></script>
    <script src="js/face.js"></script>
    <script src="js/facekit.js"></script>
    <script src="js/grime.js"></script>
    <script src="js/character.js"></script>
    <script src="js/contact.js"></script>
    <script src="js/bg.js"></script>
    <script src="cast-examples/captain.js"></script>
    <script src="cast-examples/recruit.js"></script>
    <script src="cast-examples/senator.js"></script>
    <script src="cast-examples/washer.js"></script>
    <script src="cast-examples/you.js"></script>
    <script src="js/demo-film.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
